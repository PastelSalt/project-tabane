# Every tag's fixed list, with labels (spec: "Organizing entries" and "Playbook fields").
# Layer, Origin, Status, Target and the Playbook's Kind and Status are also fixed in src/lib/tags.ts, because pages
# behave differently for them; the content check fails if the two disagree. Stack and Feature grow here: add a value
# first, then use it. One spelling per value, lowercase with hyphens.

